org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Constrained CI/Codespace machines can OOM-kill the Gradle daemon when the Gradle daemon, the
# Kotlin compile daemon, and KSP (Room + Hilt) all run as separate JVMs at once. Capping
# parallelism keeps peak memory lower at some cost to build speed.
org.gradle.parallel=false
org.gradle.workers.max=2
